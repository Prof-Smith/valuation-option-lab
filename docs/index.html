<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valuation-to-Option Pricing Lab</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--navy:#0b2747;--navy2:#163f69;--ink:#112840;--muted:#5d7086;--bg:#eef3f8;--card:#fff;--line:#d7e1ea;--teal:#0ea89c;--blue:#197aa5;--gold:#e2a72d;--orange:#f2762e;--red:#d84d4d;--green:#187457;--shadow:0 10px 30px rgba(11,39,71,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:white;padding:28px max(28px,calc((100vw - 1520px)/2));border-bottom:4px solid #0c9d94}.hero-inner{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.eyebrow{color:#ffc44f;font-size:12px;font-weight:800;letter-spacing:.16em}.hero h1{margin:7px 0 5px;font-size:34px;letter-spacing:-.035em}.hero p{margin:0;color:#d6e2ee;font-size:14px}.firm{text-align:right;font-size:12px;color:#d6e2ee;line-height:1.55}.firm b{display:block;color:white;font-size:16px}
main{max-width:1520px;margin:0 auto;padding:24px 28px 40px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.kpi{padding:18px 19px;min-height:116px;border-top:4px solid transparent}.label{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--muted)}.value{font-size:30px;font-weight:850;letter-spacing:-.035em;margin:12px 0 5px;line-height:1}.hint{font-size:11px;color:var(--muted)}
.dashboard-row{display:grid;grid-template-columns:1.02fr 1.32fr .78fr;gap:16px;margin-top:16px}.dashboard-row.bottom{grid-template-columns:1.18fr .92fr .72fr}.panel{padding:20px 20px 18px;min-width:0}.panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px}.panel h2{margin:0;font-size:16px;letter-spacing:.005em}.caption{margin:5px 0 0;color:var(--muted);font-size:11px}.section-no{width:27px;height:27px;display:inline-grid;place-items:center;background:#e8f5f4;color:#08786f;border-radius:50%;font-size:11px;margin-right:7px}.plot{height:330px;width:100%}.state-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}.state-table th,.state-table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.state-table th{color:var(--muted);font-size:9px;letter-spacing:.07em}.state-table td:nth-child(n+2){font-weight:750}.pill{display:inline-block;color:white;font-size:10px;font-weight:800;padding:5px 9px;border-radius:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.check{background:#edf9f5;border:1px solid #bfe3d8;color:var(--green);border-radius:9px;padding:9px 10px;font-size:10px;font-weight:800}.memo{background:linear-gradient(145deg,#fff,#f8fbfd)}.badge{display:inline-flex;align-items:center;gap:7px;background:#dcf4eb;color:var(--green);border-radius:16px;padding:7px 10px;font-size:10px;font-weight:800}.memo h3{font-family:Georgia,serif;font-size:27px;line-height:1.16;margin:16px 0 14px;color:var(--navy)}.memo p{font-size:13px;line-height:1.65;color:var(--muted)}.metric-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.metric-line b{font-size:14px;color:var(--ink)}.method{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:var(--navy);border-radius:15px;padding:17px 20px;margin-top:16px;color:white}.step{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;letter-spacing:.04em}.step span{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--teal);font-size:11px}.footer{display:flex;justify-content:space-between;gap:20px;padding:15px 3px 0;color:var(--muted);font-size:10px}.error{max-width:900px;margin:45px auto;background:#fff;border:1px solid #e3aaaa;border-left:5px solid var(--red);padding:25px;border-radius:12px}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(3,1fr)}.dashboard-row,.dashboard-row.bottom{grid-template-columns:1fr}.plot{height:390px}.firm{display:none}}@media(max-width:640px){.hero{padding:24px 18px}.hero h1{font-size:26px}main{padding:15px}.kpis{grid-template-columns:1fr 1fr}.value{font-size:25px}.method{grid-template-columns:1fr}.footer{display:block}.plot{height:360px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><p>Equity valuation beliefs, state-contingent payoffs, and risk-neutral pricing</p></div><div class="firm" id="firmMeta"></div></div></header>
<main id="app"><div class="card panel">Loading validated notebook results…</div></main>
<script>
const COLORS={navy:'#0b2747',blue:'#197aa5',teal:'#0ea89c',gold:'#e2a72d',orange:'#f2762e',red:'#d84d4d',slate:'#68798e'};
const CONFIG={responsive:true,displayModeBar:false,scrollZoom:false};
const money=v=>'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const baseLayout={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, Segoe UI, Arial',size:13,color:'#112840'},margin:{l:66,r:28,t:48,b:70},hoverlabel:{bgcolor:'#0b2747',bordercolor:'#0b2747',font:{size:14,color:'white'}},xaxis:{gridcolor:'#e3eaf0',zerolinecolor:'#cbd7e2',tickfont:{size:12,color:'#50647c'},automargin:true},yaxis:{gridcolor:'#dfe7ee',zerolinecolor:'#cbd7e2',tickfont:{size:12,color:'#50647c'},automargin:true}};
fetch('model_results.json',{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error('model_results.json was not generated.');return r.json()}).then(D=>{
 const m=D.model,s=D.states,v=D.validation;
 document.getElementById('firmMeta').innerHTML=`<b>${m.company} · ${m.ticker}</b>Valuation date: ${m.valuation_date}<br>${m.exercise_style} ${m.option_type} · ${m.lattice_steps}-step CRR lattice`;
 const kpis=[['CURRENT PRICE',m.spot,'Observed spot',COLORS.navy],['STUDENT DCF',m.dcf_value,'Equity value per share',COLORS.blue],['ANALYST CONSENSUS',D.analyst_stats.mean,`${D.analyst_stats.count} aligned targets`,COLORS.teal],['SELECTED STRIKE',m.strike,`${m.exercise_style} ${m.option_type}`,COLORS.gold],['CRR LATTICE',D.lattice.price,`${m.lattice_steps}-step model`,COLORS.blue],['MARKET MIDPOINT',m.market_mid,`Bid ${money(m.market_bid)} · Ask ${money(m.market_ask)}`,COLORS.orange]];
 document.getElementById('app').innerHTML=`
 <section class="kpis">${kpis.map(k=>`<div class="card kpi" style="border-top-color:${k[3]}"><div class="label">${k[0]}</div><div class="value" style="color:${k[3]}">${money(k[1])}</div><div class="hint">${k[2]}</div></div>`).join('')}</section>
 <section class="dashboard-row">
  <article class="card panel"><div class="panel-header"><div><h2><span class="section-no">1</span>Equity valuation</h2><p class="caption">Current price and independent valuation estimates</p></div></div><div id="valuation" class="plot"></div></article>
  <article class="card panel"><div class="panel-header"><div><h2><span class="section-no">2</span>Analyst target distribution</h2><p class="caption">Cross-sectional analyst opinions, not risk-neutral probabilities</p></div></div><div id="distribution" class="plot"></div></article>
  <article class="card panel"><div class="panel-header"><div><h2><span class="section-no">3</span>State construction</h2><p class="caption">Quantile-derived prices with disclosed subjective weights</p></div></div><table class="state-table"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th><th>PAYOFF</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${[COLORS.red,COLORS.gold,COLORS.teal,COLORS.blue][i]}">${z.state}</span></td><td>${money(z.terminal_price)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td><td>${money(z.option_payoff)}</td></tr>`).join('')}</tbody></table><div class="checks"><div class="check">✓ Weights total 100%</div><div class="check">✓ Inputs nonnegative</div></div></article>
 </section>
 <section class="dashboard-row bottom">
  <article class="card panel"><div class="panel-header"><div><h2><span class="section-no">4</span>Derivative payoff layer</h2><p class="caption">Continuous payoff profile with notebook-computed state outcomes</p></div></div><div id="payoff" class="plot"></div></article>
  <article class="card panel"><div class="panel-header"><div><h2><span class="section-no">5</span>Option value comparison</h2><p class="caption">Subjective expected payoff, no-arbitrage value, and observed market</p></div></div><div id="pricing" class="plot"></div><div class="checks"><div class="check">${v.inside_theoretical_bounds?'✓':'✕'} Theoretical bounds</div><div class="check">${v.put_call_parity_pass?'✓':'✕'} Put-call parity</div><div class="check">${v.valid_risk_neutral_probability?'✓':'✕'} Valid p*</div><div class="check">${v.convergence_pass?'✓':'✕'} Lattice convergence</div></div></article>
  <article class="card panel memo"><span class="badge">● VALIDATED MODEL</span><h3>${Math.abs(m.market_mid-D.lattice.price)<.25?'Market and lattice values are closely aligned.':'The model identifies a meaningful pricing gap.'}</h3><div class="metric-line"><span>CRR value</span><b>${money(D.lattice.price)}</b></div><div class="metric-line"><span>Market midpoint</span><b>${money(m.market_mid)}</b></div><div class="metric-line"><span>Belief-weighted value</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div><div class="metric-line"><span>Market–model gap</span><b>${money(m.market_mid-D.lattice.price)}</b></div><p>The belief-weighted estimate remains explicitly separate because subjective scenario weights are not risk-neutral pricing probabilities.</p></article>
 </section>
 <section class="method">${['VALUE THE EQUITY','MODEL ANALYST OPINIONS','CONSTRUCT STATES','PRICE THE CLAIM','INTERPRET THE GAP'].map((x,i)=>`<div class="step"><span>${i+1}</span>${x}</div>`).join('')}</section>
 <div class="footer"><span>Generated from student CSV inputs through the executed Python notebook.</span><span>Dashboard values are never manually typed.</span></div>`;

 const valEntries=Object.entries(D.valuation),valNames=valEntries.map(x=>x[0]),valVals=valEntries.map(x=>Number(x[1]));
 Plotly.newPlot('valuation',[{type:'bar',x:valNames,y:valVals,marker:{color:[COLORS.slate,COLORS.gold,COLORS.blue,COLORS.teal],line:{color:'white',width:1}},text:valVals.map(money),textposition:'outside',cliponaxis:false,textfont:{size:16,color:COLORS.navy},hovertemplate:'<b>%{x}</b><br>%{text}<extra></extra>'}],{...baseLayout,showlegend:false,bargap:.28,margin:{l:68,r:25,t:50,b:85},xaxis:{...baseLayout.xaxis,tickangle:0,tickfont:{size:12}},yaxis:{...baseLayout.yaxis,tickprefix:'$',tickformat:',.0f',rangemode:'tozero',range:[0,Math.max(...valVals)*1.24]}},CONFIG);

 const rawTargets=D.analyst_targets.map(Number).filter(Number.isFinite).sort((a,b)=>a-b); const tMin=Math.min(...rawTargets),tMax=Math.max(...rawTargets),pad=Math.max((tMax-tMin)*.14,3);
 Plotly.newPlot('distribution',[{type:'box',x:rawTargets,name:'Target range',boxpoints:'all',jitter:.38,pointpos:0,orientation:'h',marker:{size:11,color:COLORS.teal,line:{color:'white',width:1.5}},line:{color:COLORS.navy,width:2},fillcolor:'rgba(14,168,156,.12)',hovertemplate:'Analyst target: <b>%{x:$,.2f}</b><extra></extra>'}],{...baseLayout,showlegend:false,margin:{l:35,r:30,t:58,b:65},xaxis:{...baseLayout.xaxis,title:{text:'12-month price target',font:{size:13}},tickprefix:'$',tickformat:',.0f',range:[tMin-pad,tMax+pad],nticks:7},yaxis:{visible:false},shapes:[{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.mean),x1:Number(D.analyst_stats.mean),y0:.08,y1:.92,line:{color:COLORS.navy,width:3}},{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.median),x1:Number(D.analyst_stats.median),y0:.08,y1:.92,line:{color:COLORS.gold,width:3,dash:'dash'}}],annotations:[{xref:'x',yref:'paper',x:Number(D.analyst_stats.mean),y:1.04,text:`Mean ${money(D.analyst_stats.mean)}`,showarrow:false,font:{size:13,color:COLORS.navy},xanchor:'left'},{xref:'x',yref:'paper',x:Number(D.analyst_stats.median),y:-.08,text:`Median ${money(D.analyst_stats.median)}`,showarrow:false,font:{size:13,color:'#946900'},xanchor:'right'}]},CONFIG);

 const statePrices=s.map(z=>Number(z.terminal_price)),xmin=Math.min(...statePrices,Number(m.strike)),xmax=Math.max(...statePrices,Number(m.strike)),pRange=Math.max(xmax-xmin,10),xStart=Math.max(0,xmin-pRange*.32),xEnd=xmax+pRange*.28,x=[];for(let q=xStart;q<=xEnd;q+=(xEnd-xStart)/150)x.push(q);const curve=x.map(q=>m.option_type==='call'?Math.max(q-m.strike,0):Math.max(m.strike-q,0));
 Plotly.newPlot('payoff',[{type:'scatter',mode:'lines',x,y:curve,line:{color:COLORS.orange,width:4},fill:'tozeroy',fillcolor:'rgba(242,118,46,.08)',name:'Payoff',hovertemplate:'Terminal stock: <b>%{x:$,.2f}</b><br>Payoff: <b>%{y:$,.2f}</b><extra></extra>'},{type:'scatter',mode:'markers+text',x:statePrices,y:s.map(z=>Number(z.option_payoff)),text:s.map(z=>`${z.state}<br>${money(z.option_payoff)}`),textposition:['bottom center','bottom center','top center','top center'],textfont:{size:13,color:COLORS.navy},marker:{size:14,color:[COLORS.red,COLORS.gold,COLORS.teal,COLORS.blue],line:{color:'white',width:2}},hovertemplate:'<b>%{text}</b><br>Stock: %{x:$,.2f}<extra></extra>'}],{...baseLayout,showlegend:false,margin:{l:72,r:25,t:58,b:70},xaxis:{...baseLayout.xaxis,title:{text:'Terminal stock price',font:{size:13}},tickprefix:'$',tickformat:',.0f',dtick:Math.max(5,Math.round(pRange/6/5)*5),range:[xStart,xEnd]},yaxis:{...baseLayout.yaxis,title:{text:'Option payoff',font:{size:13}},tickprefix:'$',tickformat:',.0f',rangemode:'tozero'},shapes:[{type:'line',x0:Number(m.strike),x1:Number(m.strike),y0:0,y1:Math.max(...curve),line:{color:COLORS.navy,width:2,dash:'dot'}}],annotations:[{x:Number(m.strike),y:Math.max(...curve)*.92,text:`Strike ${money(m.strike)}`,showarrow:false,xanchor:'left',font:{size:12,color:COLORS.navy}}]},CONFIG);

 const compareEntries=Object.entries(D.comparison),compareNames=['Belief-weighted','CRR lattice','Market midpoint'],compareVals=compareEntries.map(x=>Number(x[1]));
 Plotly.newPlot('pricing',[{type:'bar',x:compareNames,y:compareVals,marker:{color:[COLORS.teal,COLORS.blue,COLORS.orange],line:{color:'white',width:1}},text:compareVals.map(money),textposition:'outside',cliponaxis:false,textfont:{size:17,color:COLORS.navy},hovertemplate:'<b>%{x}</b><br>%{text}<extra></extra>'}],{...baseLayout,showlegend:false,bargap:.34,margin:{l:65,r:25,t:52,b:78},xaxis:{...baseLayout.xaxis,tickfont:{size:12}},yaxis:{...baseLayout.yaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...compareVals)*1.28]}},CONFIG);
}).catch(e=>document.getElementById('app').innerHTML=`<div class="error"><b>Dashboard results are unavailable.</b><p>${e.message}</p><p>Run the notebook to regenerate <code>docs/model_results.json</code>.</p></div>`);
</script>
</body></html>
