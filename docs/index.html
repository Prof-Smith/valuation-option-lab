<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valuation-to-Option Pricing Lab</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--n:#0b2747;--b:#197ba6;--t:#0fa99d;--g:#e2a72d;--o:#f2762e;--r:#d94d4d;--p:#7c5ab8;--m:#5a6e84;--bg:#eef3f8;--line:#d6e1eb;--green:#187457}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#0b2747,#173f68);color:#fff;padding:28px 4%;border-bottom:4px solid var(--t)}header h1{font-size:33px;margin:7px 0 4px}.eyebrow{color:#ffc44f;font-size:12px;font-weight:800;letter-spacing:.15em}header p{margin:0;color:#d8e4ef}main{max-width:1500px;margin:auto;padding:24px 28px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #0b274714}.kpi{padding:18px;border-top:4px solid transparent}.label{font-size:10px;font-weight:800;color:var(--m);letter-spacing:.08em}.value{font-size:29px;font-weight:850;margin:12px 0 5px}.hint,.caption{font-size:11px;color:var(--m)}.row{display:grid;grid-template-columns:1.08fr 1fr .82fr;gap:16px;margin-top:16px}.panel{padding:20px;min-width:0}.panel h2{font-size:16px;margin:0 0 5px}.plot{height:335px}.state-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}.state-table th,.state-table td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}.state-table th{font-size:9px;color:var(--m)}.pill{color:#fff;font-size:9px;font-weight:800;padding:5px 8px;border-radius:12px}.decomp{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.mini{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px}.mini span{display:block;color:var(--m);font-size:9px;font-weight:800;letter-spacing:.06em}.mini b{display:block;font-size:19px;margin-top:7px}.note{border-left:4px solid var(--g);background:#fff9eb;padding:13px 15px;margin-top:14px;border-radius:8px;font-size:12px;line-height:1.55;color:#655020}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.check{background:#edf9f5;border:1px solid #bde2d7;color:var(--green);padding:9px;border-radius:9px;font-size:10px;font-weight:800}.memo h3{font:700 25px/1.18 Georgia,serif}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.metric b{font-size:14px}.memo p{font-size:13px;color:var(--m);line-height:1.6}.footer{padding:17px 2px;color:var(--m);font-size:10px}@media(max-width:1100px){.grid6{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr}.plot{height:390px}}@media(max-width:620px){main{padding:14px}.grid6{grid-template-columns:1fr 1fr}.decomp{grid-template-columns:1fr 1fr}.value{font-size:24px}}
</style></head><body><header><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><p>Five analyst-informed scenarios alongside a separate CRR no-arbitrage valuation</p></header><main id="app">Loading notebook-generated results…</main><script>
const C=['#d94d4d','#eb7d3c','#e2a72d','#0fa99d','#197ba6'],cfg={responsive:true,displayModeBar:false};const money=v=>'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter,Segoe UI,Arial',size:13,color:'#0b2747'},margin:{l:65,r:25,t:42,b:70},xaxis:{gridcolor:'#e1e8ef',tickfont:{size:12}},yaxis:{gridcolor:'#dce5ed',tickfont:{size:12}},hoverlabel:{bgcolor:'#0b2747',font:{color:'#fff',size:14}}};
fetch('model_results.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{const m=D.model,s=D.states,b=D.belief_decomposition,v=D.validation;const k=[['CURRENT PRICE',m.spot,'Observed spot','#0b2747'],['STUDENT DCF',m.dcf_value,'Equity value per share','#197ba6'],['ANALYST MEAN',D.analyst_stats.mean,D.analyst_stats.count+' aligned targets','#0fa99d'],['SELECTED STRIKE',m.strike,m.exercise_style+' '+m.option_type,'#e2a72d'],['CRR VALUE',D.lattice.price,m.lattice_steps+'-step lattice','#197ba6'],['MARKET MIDPOINT',m.market_mid,'Bid '+money(m.market_bid)+' · Ask '+money(m.market_ask),'#f2762e']];app.innerHTML=`<section class="grid6">${k.map(x=>`<div class="card kpi" style="border-top-color:${x[3]}"><div class="label">${x[0]}</div><div class="value" style="color:${x[3]}">${money(x[1])}</div><div class="hint">${x[2]}</div></div>`).join('')}</section><section class="row"><article class="card panel"><h2>Five analyst-informed states</h2><div class="caption">Scenario prices and subjective weights, not a five-branch binomial tree</div><div id="states" class="plot"></div><table class="state-table"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th><th>PAYOFF</th><th>CONTRIBUTION</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${C[i]}">${z.state}</span></td><td>${money(z.terminal_price)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td><td>${money(z.option_payoff)}</td><td>${money(z.weighted_payoff)}</td></tr>`).join('')}</tbody></table></article><article class="card panel"><h2>Analyst-scenario payoff decomposition</h2><div class="caption">State payoff × subjective weight, then discounted to today</div><div id="decomposition" class="plot"></div><div class="decomp"><div class="mini"><span>ZERO-PAYOFF WEIGHT</span><b>${(b.weight_zero_payoff*100).toFixed(0)}%</b></div><div class="mini"><span>POSITIVE-PAYOFF WEIGHT</span><b>${(b.weight_positive_payoff*100).toFixed(0)}%</b></div><div class="mini"><span>WEIGHTED TERMINAL PAYOFF</span><b>${money(b.weighted_terminal_payoff)}</b></div><div class="mini"><span>DISCOUNTED VALUE</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div></div><div class="note">${D.distribution_comparison.message} The scenario value and CRR value therefore answer different questions and should not be expected to match.</div></article><article class="card panel memo"><h2>Comparison and interpretation</h2><div id="comparison" class="plot"></div><div class="metric"><span>Analyst-scenario expected payoff</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div><div class="metric"><span>CRR risk-neutral value</span><b>${money(D.lattice.price)}</b></div><div class="metric"><span>Observed market midpoint</span><b>${money(m.market_mid)}</b></div><div class="checks"><div class="check">${v.inside_theoretical_bounds?'✓':'✕'} Bounds</div><div class="check">${v.put_call_parity_pass?'✓':'✕'} Put-call parity</div><div class="check">${v.valid_risk_neutral_probability?'✓':'✕'} Valid p*</div><div class="check">${v.convergence_pass?'✓':'✕'} Convergence</div></div><p>The five-state result is a discounted expected payoff under subjective analyst scenarios. The CRR result is the no-arbitrage model value.</p></article></section><div class="footer">Generated from student CSV inputs through the executed Python notebook. Dashboard values are not manually typed.</div>`;
Plotly.newPlot('states',[{type:'bar',x:s.map(z=>z.state),y:s.map(z=>z.terminal_price),marker:{color:C},text:s.map(z=>money(z.terminal_price)),textposition:'outside',cliponaxis:false,textfont:{size:14},hovertemplate:'<b>%{x}</b><br>Terminal price %{text}<extra></extra>'}],{...base,showlegend:false,yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...s.map(z=>z.terminal_price))*1.2]},margin:{l:58,r:20,t:38,b:70}},cfg);
Plotly.newPlot('decomposition',[{type:'bar',x:s.map(z=>z.state),y:s.map(z=>z.weighted_payoff),marker:{color:C},text:s.map(z=>money(z.weighted_payoff)),textposition:'outside',cliponaxis:false,textfont:{size:14},hovertemplate:'<b>%{x}</b><br>Weighted payoff %{text}<extra></extra>'}],{...base,showlegend:false,yaxis:{...base.yaxis,tickprefix:'$',tickformat:'.2f',title:'Weighted payoff'},margin:{l:65,r:20,t:38,b:70}},cfg);
const vals=Object.values(D.comparison),names=['Analyst scenario','CRR lattice','Market midpoint'];Plotly.newPlot('comparison',[{type:'bar',x:names,y:vals,marker:{color:['#0fa99d','#197ba6','#f2762e']},text:vals.map(money),textposition:'outside',cliponaxis:false,textfont:{size:16},hovertemplate:'<b>%{x}</b><br>%{text}<extra></extra>'}],{...base,showlegend:false,yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...vals)*1.27]},margin:{l:58,r:20,t:38,b:70}},cfg);
}).catch(e=>app.innerHTML='<div class="card panel"><b>Dashboard results unavailable.</b><br>'+e.message+'</div>');
</script></body></html>
