<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valuation-to-Option Pricing Lab</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--navy:#102b4e;--blue:#20749b;--teal:#12a79e;--gold:#dda631;--orange:#f27a30;--red:#d64c4c;--ink:#11243e;--muted:#50647c;--bg:#edf2f7;--card:#fff;--line:#d3dee9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#09223e,#173c63);color:white;padding:30px 4%}header h1{font-size:34px;margin:5px 0}.eyebrow{color:#ffc34d;font-size:13px;font-weight:800;letter-spacing:.14em}.sub{font-size:15px;color:#d8e3ef}main{max-width:1500px;margin:auto;padding:24px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px #102b4e10}.kpi{padding:19px}.label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}.value{font-size:31px;font-weight:800;margin:11px 0 5px}.hint{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1.25fr .75fr;gap:16px;margin-top:16px}.bottom{grid-template-columns:1.15fr .9fr .7fr}.panel{padding:20px}.panel h2{font-size:17px;margin:0}.caption{font-size:12px;color:var(--muted);margin:6px 0 8px}.plot{height:310px}.states{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}.states th,.states td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.states th{font-size:10px;color:var(--muted)}.pill{color:white;font-size:11px;font-weight:800;padding:5px 9px;border-radius:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.check{padding:10px;border-radius:9px;background:#edf9f5;border:1px solid #bfe3d7;color:#176d51;font-size:11px;font-weight:800}.memo h3{font-family:Georgia,serif;font-size:27px;line-height:1.2}.memo p{font-size:14px;line-height:1.6;color:var(--muted)}.badge{display:inline-block;background:#dcf4eb;color:#176d51;border-radius:14px;padding:7px 10px;font-size:11px;font-weight:800}.foot{padding:18px 2px;color:var(--muted);font-size:11px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr}}@media(max-width:600px){main{padding:13px}.kpis{grid-template-columns:1fr 1fr}.value{font-size:25px}.plot{height:340px}}
</style></head><body><header><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><div class="sub">Notebook-driven analysis with interactive Plotly visualizations</div></header><main id="app">Loading notebook-generated results…</main><script>
const cfg={responsive:true,displayModeBar:false};const layoutBase={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Arial',size:14,color:'#11243e'},margin:{l:58,r:20,t:30,b:60},xaxis:{gridcolor:'#dce5ee',tickfont:{size:13}},yaxis:{gridcolor:'#dce5ee',tickfont:{size:13}},hoverlabel:{font:{size:14}}};
fetch('model_results.json').then(r=>r.json()).then(D=>{const m=D.model,s=D.states,v=D.validation;app.innerHTML=`<section class="kpis">${[['CURRENT PRICE',m.spot,'Observed spot','#11243e'],['STUDENT DCF',m.dcf_value,'Equity value per share','#20749b'],['ANALYST CONSENSUS',D.analyst_stats.mean,D.analyst_stats.count+' aligned targets','#12a79e'],['SELECTED STRIKE',m.strike,m.exercise_style+' '+m.option_type,'#dda631'],['CRR LATTICE',D.lattice.price,m.lattice_steps+'-step model','#20749b'],['MARKET MIDPOINT',m.market_mid,'Bid $'+m.market_bid.toFixed(2)+' · Ask $'+m.market_ask.toFixed(2),'#f27a30']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value" style="color:${x[3]}">$${x[1].toFixed(2)}</div><div class="hint">${x[2]}</div></div>`).join('')}</section><section class="row"><div class="card panel"><h2>1 · Equity valuation</h2><div class="caption">Current price and valuation estimates</div><div id="valuation" class="plot"></div></div><div class="card panel"><h2>2 · Analyst target distribution</h2><div class="caption">Analyst opinions, not risk-neutral probabilities</div><div id="distribution" class="plot"></div></div><div class="card panel"><h2>3 · State construction</h2><div class="caption">Quantile-derived prices with disclosed subjective weights</div><table class="states"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${['#d64c4c','#dda631','#12a79e','#20749b'][i]}">${z.state}</span></td><td><b>$${z.terminal_price.toFixed(2)}</b></td><td><b>${(z.subjective_weight*100).toFixed(0)}%</b></td></tr>`).join('')}</tbody></table></div></section><section class="row bottom"><div class="card panel"><h2>4 · Derivative payoff layer</h2><div class="caption">Notebook-computed payoff at every state</div><div id="payoff" class="plot"></div></div><div class="card panel"><h2>5 · Option value comparison</h2><div class="caption">Subjective expected payoff, no-arbitrage model, and market</div><div id="pricing" class="plot"></div><div class="checks"><div class="check">${v.inside_theoretical_bounds?'✓':'✕'} Bounds</div><div class="check">${v.put_call_parity_pass?'✓':'✕'} Put-call parity</div><div class="check">${v.valid_risk_neutral_probability?'✓':'✕'} Valid p*</div><div class="check">${v.convergence_pass?'✓':'✕'} Converged</div></div></div><div class="card panel memo"><span class="badge">● VALIDATED MODEL</span><h3>Market and lattice values are closely aligned.</h3><p>CRR value: <b>$${D.lattice.price.toFixed(2)}</b><br>Market midpoint: <b>$${m.market_mid.toFixed(2)}</b><br>Belief-weighted value: <b>$${D.valuation_weighted_expected_payoff.toFixed(2)}</b></p><p>The belief-weighted result remains explicitly separate from the risk-neutral price.</p></div></section><div class="foot">Generated from student CSV inputs through the executed Python notebook. The deployment workflow is unchanged.</div>`;
const valNames=Object.keys(D.valuation),valVals=Object.values(D.valuation);Plotly.newPlot('valuation',[{type:'bar',x:valNames,y:valVals,text:valVals.map(x=>'$'+x.toFixed(2)),textposition:'outside',textfont:{size:16,color:'#11243e'},marker:{color:['#66758a','#dda631','#20749b','#12a79e']},hovertemplate:'%{x}<br><b>$%{y:.2f}</b><extra></extra>'}],{...layoutBase,yaxis:{...layoutBase.yaxis,tickprefix:'$',range:[0,Math.max(...valVals)*1.22]},margin:{l:60,r:20,t:38,b:80}},cfg);
Plotly.newPlot('distribution',[{type:'scatter',mode:'markers',x:D.analyst_targets,y:D.analyst_targets.map((_,i)=>(i%3)-1),marker:{size:13,color:'#12a79e',line:{color:'white',width:2}},hovertemplate:'Target <b>$%{x:.2f}</b><extra></extra>'}],{...layoutBase,yaxis:{visible:false},xaxis:{...layoutBase.xaxis,tickprefix:'$',title:'12-month price target'},shapes:[{type:'line',x0:D.analyst_stats.mean,x1:D.analyst_stats.mean,y0:-1.5,y1:1.5,line:{color:'#102b4e',width:3}},{type:'line',x0:D.analyst_stats.median,x1:D.analyst_stats.median,y0:-1.5,y1:1.5,line:{color:'#dda631',width:3,dash:'dash'}}],annotations:[{x:D.analyst_stats.mean,y:1.35,text:'Mean $'+D.analyst_stats.mean.toFixed(2),showarrow:false,font:{size:14,color:'#102b4e'}},{x:D.analyst_stats.median,y:-1.35,text:'Median $'+D.analyst_stats.median.toFixed(2),showarrow:false,font:{size:14,color:'#9a6b00'}}]},cfg);
const xmin=Math.min(...s.map(z=>z.terminal_price),m.strike)*.85,xmax=Math.max(...s.map(z=>z.terminal_price),m.strike)*1.1,x=[];for(let q=xmin;q<=xmax;q+=(xmax-xmin)/120)x.push(q);const py=x.map(q=>m.option_type==='call'?Math.max(q-m.strike,0):Math.max(m.strike-q,0));Plotly.newPlot('payoff',[{type:'scatter',mode:'lines',x,y:py,line:{color:'#f27a30',width:4},name:'Payoff',hovertemplate:'Stock $%{x:.2f}<br>Payoff <b>$%{y:.2f}</b><extra></extra>'},{type:'scatter',mode:'markers+text',x:s.map(z=>z.terminal_price),y:s.map(z=>z.option_payoff),text:s.map(z=>z.state+' $'+z.option_payoff.toFixed(2)),textposition:'top center',textfont:{size:13},marker:{size:13,color:['#d64c4c','#dda631','#12a79e','#20749b'],line:{color:'white',width:2}},hovertemplate:'%{text}<extra></extra>'}],{...layoutBase,xaxis:{...layoutBase.xaxis,tickprefix:'$',title:'Terminal stock price'},yaxis:{...layoutBase.yaxis,tickprefix:'$',title:'Option payoff'},showlegend:false},cfg);
const cn=Object.keys(D.comparison),cv=Object.values(D.comparison);Plotly.newPlot('pricing',[{type:'bar',x:cn,y:cv,text:cv.map(x=>'$'+x.toFixed(2)),textposition:'outside',textfont:{size:17,color:'#11243e'},marker:{color:['#12a79e','#20749b','#f27a30']},hovertemplate:'%{x}<br><b>$%{y:.2f}</b><extra></extra>'}],{...layoutBase,yaxis:{...layoutBase.yaxis,tickprefix:'$',range:[0,Math.max(...cv)*1.25]},xaxis:{...layoutBase.xaxis,tickfont:{size:11}},margin:{l:55,r:20,t:38,b:100}},cfg);
}).catch(e=>app.innerHTML='<div class="card panel"><b>Dashboard data unavailable.</b><br>'+e.message+'</div>');
</script></body></html>
