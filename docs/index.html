<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valuation-to-Option Pricing Lab</title><style>
:root{--n:#10243f;--b:#216b8f;--t:#18a59b;--g:#d9a23a;--o:#eb7639;--r:#c84a4a;--bg:#f3f6f9;--m:#66758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#0b2039,#173758);color:#fff;padding:30px 4%}header h1{margin:6px 0;font-size:30px}.eyebrow{color:#f1ba50;font-size:12px;font-weight:800;letter-spacing:.14em}.sub{color:#cbd7e5}main{padding:22px 3%;max-width:1550px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.card{background:#fff;border:1px solid #dce5ed;border-radius:15px;box-shadow:0 8px 24px #17375812;padding:19px}.label{font-size:10px;color:var(--m);font-weight:bold;letter-spacing:.08em}.value{font-size:25px;font-weight:800;margin:12px 0 5px}.hint,.cap{font-size:11px;color:var(--m)}.grid{display:grid;grid-template-columns:1.05fr 1.25fr .8fr;gap:15px;margin-top:15px}.bottom{display:grid;grid-template-columns:1.15fr .85fr .75fr;gap:15px;margin-top:15px}h2{font-size:15px;margin:0;text-transform:uppercase}.cap{margin:6px 0 12px}.accent{height:4px;width:52px;border-radius:3px;background:var(--t);margin-bottom:15px}.chart{height:210px;width:100%}.states{width:100%;border-collapse:collapse;font-size:12px}.states td,.states th{padding:10px 7px;border-bottom:1px solid #e8edf2;text-align:left}.states th{font-size:9px;color:var(--m)}.pill{color:#fff;border-radius:12px;padding:4px 8px;font-weight:bold;font-size:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.check{background:#eff9f5;border:1px solid #cce7dc;color:#267457;border-radius:9px;padding:8px;font-size:10px;font-weight:bold}.controls{display:flex;gap:18px;background:#eef3f7;border-radius:11px;padding:12px;margin-bottom:12px}.controls>div{flex:1}.controls label{font-size:10px;font-weight:bold;color:var(--m);display:block;margin-bottom:7px}.controls input,.controls select{width:100%}.memo h3{font-family:Georgia,serif;font-size:24px;line-height:1.2}.memo p{font-size:12px;line-height:1.6;color:var(--m)}.badge{display:inline-block;background:#e3f4ef;color:#287558;padding:7px 10px;border-radius:15px;font-size:10px;font-weight:bold}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:var(--n);color:#fff;padding:17px;border-radius:14px;margin-top:15px}.step{font-size:10px;font-weight:bold}.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--t);margin-right:7px}.foot{font-size:10px;color:var(--m);padding:16px 3px}.error{margin:40px auto;max-width:800px;background:#fff0f0;border:1px solid #e2aaaa;padding:20px;border-radius:12px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid,.bottom{grid-template-columns:1fr}}@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr}}
</style></head><body><header><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><div class="sub">Live notebook analysis feeding a polished dashboard</div></header><main id="app"><div class="card">Loading validated notebook results…</div></main><script>
const C={market:'#66758a',comps:'#d9a23a',dcf:'#216b8f',median:'#18a59b',orange:'#eb7639',red:'#c84a4a'};const NS='http://www.w3.org/2000/svg';function E(t,a={},x=''){let n=document.createElementNS(NS,t);for(let k in a)n.setAttribute(k,a[k]);n.textContent=x;return n}function T(s,x,y,v,a={}){s.appendChild(E('text',{x,y,fill:'#66758a','font-size':11,'font-family':'Arial',...a},v))}function L(s,x1,y1,x2,y2,a={}){s.appendChild(E('line',{x1,y1,x2,y2,stroke:'#dbe4ed',...a}))}function bars(id,data,max,cs){let s=document.getElementById(id),w=+s.viewBox.baseVal.width,h=+s.viewBox.baseVal.height,l=42,b=34,g=(w-l-10)/data.length;[0,.25,.5,.75,1].forEach(q=>{let y=12+(h-46)*(1-q);L(s,l,y,w-8,y);T(s,l-6,y+4,(max*q).toFixed(0),{'text-anchor':'end'})});data.forEach((d,i)=>{let bh=(h-46)*d.v/max,x=l+i*g+g*.2,y=h-b-bh,bw=g*.55;s.appendChild(E('rect',{x,y,width:bw,height:bh,rx:5,fill:cs[i]}));T(s,x+bw/2,y-7,'$'+d.v.toFixed(2),{'text-anchor':'middle',fill:'#17263d','font-weight':'bold'});T(s,x+bw/2,h-12,d.n,{'text-anchor':'middle','font-size':10})})}
fetch('model_results.json').then(r=>{if(!r.ok)throw Error('model_results.json missing');return r.json()}).then(D=>{const m=D.model,s=D.states,v=D.validation;document.getElementById('app').innerHTML=`<section class="kpis"><div class="card"><div class="label">CURRENT PRICE</div><div class="value">$${m.spot.toFixed(2)}</div><div class="hint">Observed spot</div></div><div class="card"><div class="label">STUDENT DCF</div><div class="value" style="color:var(--b)">$${m.dcf_value.toFixed(2)}</div><div class="hint">Equity value per share</div></div><div class="card"><div class="label">ANALYST CONSENSUS</div><div class="value" style="color:var(--t)">$${D.analyst_stats.mean.toFixed(2)}</div><div class="hint">${D.analyst_stats.count} aligned targets</div></div><div class="card"><div class="label">SELECTED STRIKE</div><div class="value" style="color:var(--g)">$${m.strike.toFixed(2)}</div><div class="hint">${m.exercise_style} ${m.option_type}</div></div><div class="card"><div class="label">CRR LATTICE</div><div class="value" style="color:var(--b)">$${D.lattice.price.toFixed(2)}</div><div class="hint">${m.lattice_steps}-step model</div></div><div class="card"><div class="label">MARKET MIDPOINT</div><div class="value" style="color:var(--o)">$${m.market_mid.toFixed(2)}</div><div class="hint">Bid $${m.market_bid.toFixed(2)} · Ask $${m.market_ask.toFixed(2)}</div></div></section><section class="grid"><div class="card"><h2>1 · Equity valuation</h2><div class="cap">Current price and valuation estimates</div><div class="accent"></div><svg id="valuation" class="chart" viewBox="0 0 520 220"></svg></div><div class="card"><h2>2 · Analyst target distribution</h2><div class="cap">Analyst opinions, not risk-neutral probabilities</div><div class="accent"></div><svg id="distribution" class="chart" viewBox="0 0 620 220"></svg></div><div class="card"><h2>3 · State construction</h2><div class="cap">Transparent subjective weights</div><div class="accent" style="background:var(--g)"></div><table class="states"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${[C.red,C.comps,C.median,C.dcf][i]}">${z.state}</span></td><td>$${z.terminal_price.toFixed(0)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td></tr>`).join('')}</tbody></table><div class="checks"><div class="check">✓ Weights = 100%</div><div class="check">✓ Nonnegative</div></div></div></section><section class="bottom"><div class="card"><h2>4 · Derivative payoff layer</h2><div class="cap">Notebook-computed state payoffs</div><div class="accent" style="background:var(--o)"></div><svg id="payoff" class="chart" viewBox="0 0 650 220"></svg></div><div class="card"><h2>5 · Option value comparison</h2><div class="cap">Three distinct valuation lenses</div><div class="accent"></div><svg id="pricing" class="chart" viewBox="0 0 500 240"></svg><div class="checks"><div class="check">${v.inside_theoretical_bounds?'✓':'✕'} Bounds</div><div class="check">${v.put_call_parity_pass?'✓':'✕'} Put-call parity</div><div class="check">${v.valid_risk_neutral_probability?'✓':'✕'} Valid p*</div><div class="check">${v.convergence_pass?'✓':'✕'} Converged</div></div></div><div class="card memo"><span class="badge">● VALIDATED MODEL</span><h3>Market and lattice values are closely aligned.</h3><p>The CRR value of <b>$${D.lattice.price.toFixed(2)}</b> is compared with the market midpoint of <b>$${m.market_mid.toFixed(2)}</b>. The belief-weighted result of <b>$${D.valuation_weighted_expected_payoff.toFixed(2)}</b> is labeled separately because subjective state weights are not risk-neutral probabilities.</p><p><b>Model gap:</b> $${(m.market_mid-D.lattice.price).toFixed(2)}.</p></div></section><section class="flow">${['VALUE THE EQUITY','MODEL OPINIONS','BUILD STATES','PRICE THE CLAIM','EXPLAIN THE GAP'].map((x,i)=>`<div class="step"><span class="num">${i+1}</span>${x}</div>`).join('')}</section><div class="foot">Generated from the executed Python notebook. Dashboard values are not manually typed.</div>`;
let vals=Object.entries(D.valuation).map(([n,v])=>({n:n.replace('Comparable companies','Comps').replace('Student DCF','DCF').replace('Analyst median','Median'),v}));bars('valuation',vals,Math.max(...vals.map(x=>x.v))*1.08,[C.market,C.comps,C.dcf,C.median]);bars('pricing',Object.entries(D.comparison).map(([n,v])=>({n:n.replace('Valuation-weighted expected payoff','Belief-weighted').replace('Risk-neutral lattice value','CRR lattice').replace('Observed market midpoint','Market mid'),v})),Math.max(...Object.values(D.comparison))*1.15,[C.median,C.dcf,C.orange]);let ds=document.getElementById('distribution');for(let x=80;x<=130;x+=10){let px=35+(x-80)/50*565;L(ds,px,30,px,180);T(ds,px,200,'$'+x,{'text-anchor':'middle'})}L(ds,35,115,600,115,{stroke:'#9aabba','stroke-width':2});D.analyst_targets.forEach((x,i)=>ds.appendChild(E('circle',{cx:35+(x-80)/50*565,cy:115-(i%3)*12,r:6,fill:C.median,stroke:'white','stroke-width':2})));let ps=document.getElementById('payoff'),min=70,max=145,mp=Math.max(...s.map(z=>z.option_payoff),10);[0,.25,.5,.75,1].forEach(q=>{let y=12+174*(1-q);L(ps,42,y,635,y);T(ps,36,y+4,(mp*q).toFixed(0),{'text-anchor':'end'})});let pts=[];for(let x=min;x<=max;x++){let p=m.option_type==='call'?Math.max(x-m.strike,0):Math.max(m.strike-x,0);pts.push((42+(x-min)/75*593)+','+(12+174*(1-p/mp)))}ps.appendChild(E('polyline',{points:pts.join(' '),fill:'none',stroke:C.orange,'stroke-width':4}));s.forEach((z,i)=>{let x=42+(z.terminal_price-min)/75*593,y=12+174*(1-z.option_payoff/mp);ps.appendChild(E('circle',{cx:x,cy:y,r:7,fill:[C.red,C.comps,C.median,C.dcf][i],stroke:'white','stroke-width':2}));T(ps,x,y-11,z.state+': $'+z.option_payoff.toFixed(0),{'text-anchor':'middle','font-size':9,'font-weight':'bold'})});}).catch(e=>document.getElementById('app').innerHTML=`<div class="error"><b>Dashboard data was not generated.</b><br>${e.message}<br>Run the notebook or the GitHub workflow.</div>`);
</script></body></html>
