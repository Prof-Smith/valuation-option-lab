<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valuation-to-Option Pricing Lab</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--navy:#0b2747;--blue:#197ba6;--teal:#0f9188;--gold:#c78a12;--orange:#e26522;--red:#bd3f3f;--green:#187457;--ink:#10243d;--muted:#5b6f85;--bg:#eef3f8;--line:#d6e1eb;--card:#fff;--shadow:0 10px 28px rgba(11,39,71,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button{font:inherit}.hero{background:linear-gradient(120deg,var(--navy),#173f68);color:#fff;padding:26px max(22px,calc((100vw - 1400px)/2));border-bottom:4px solid var(--teal)}.hero-in{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:#ffd16a;font-size:12px;font-weight:800;letter-spacing:.14em}.hero h1{margin:7px 0 4px;font-size:32px}.hero p{margin:0;color:#d8e4ef}.meta{text-align:right;font-size:12px;line-height:1.55;color:#d8e4ef}.meta b{color:#fff;font-size:15px}main{max-width:1400px;margin:auto;padding:20px 24px 38px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.start{padding:20px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px}.start h2{margin:0 0 8px}.track{border-radius:12px;padding:14px;border:1px solid}.belief{background:#eefaf8;border-color:#a9ddd7}.pricing{background:#edf5fb;border-color:#b9d6e8}.tag{font-size:10px;font-weight:850;letter-spacing:.08em}.start p,.small{font-size:12px;line-height:1.55;color:var(--muted)}.status{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12px;font-weight:750}.ok{background:#edf9f5;border:1px solid #bde2d7;color:var(--green)}.warn{background:#fff7e8;border:1px solid #ecd29a;color:#715112}.tabs{display:flex;gap:8px;overflow:auto;padding:15px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:999px;color:var(--muted);cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.stage{display:none}.stage.active{display:block}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{padding:18px}.panel h2{margin:0;font-size:17px}.panel h3{margin:0 0 5px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:17px;border-top:4px solid}.label{font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.08em}.value{font-size:28px;font-weight:850;margin:10px 0 4px}.plot{height:340px}.table-wrap{overflow:auto}.state{width:100%;border-collapse:collapse;font-size:12px}.state th,.state td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.state th{font-size:9px;color:var(--muted)}.pill{color:#fff;padding:5px 8px;border-radius:12px;font-weight:800}.checks{display:grid;gap:9px}.check{border:1px solid var(--line);border-radius:10px;overflow:hidden}.check button{width:100%;text-align:left;border:0;background:#f7fafc;padding:12px;cursor:pointer;font-weight:800;color:var(--ink)}.detail{display:none;padding:0 12px 12px;font-size:12px;color:var(--muted);line-height:1.5}.check.open .detail{display:block}.memo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.prompt{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px}.prompt b{display:block;margin-bottom:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy)}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.progress label{font-size:11px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px}.error{max-width:800px;margin:40px auto;background:#fff;padding:24px;border-left:5px solid var(--red);border-radius:10px}.footer{font-size:11px;color:var(--muted);padding:18px 2px}.sr{position:absolute;left:-9999px}
@media(max-width:900px){.start,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.progress{grid-template-columns:1fr 1fr}.meta{display:none}}@media(max-width:520px){main{padding:14px}.hero{padding:22px 16px}.hero h1{font-size:25px}.kpis,.memo-grid{grid-template-columns:1fr}.plot{height:315px}.progress{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div class="hero-in"><div><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><p>From equity beliefs to state-contingent payoffs and no-arbitrage pricing</p></div><div class="meta" id="meta"></div></div></header><main id="app"><div class="card panel">Loading validated notebook results…</div></main><script>
const money=v=>'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const colors=['#bd3f3f','#e26522','#c78a12','#0f9188','#197ba6'];const cfg={responsive:true,displayModeBar:true,modeBarButtonsToRemove:['lasso2d','select2d'],displaylogo:false,toImageButtonOptions:{format:'png',filename:'valuation-option-lab'}};const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter,Segoe UI,Arial',color:'#10243d'},margin:{l:60,r:20,t:30,b:55},xaxis:{gridcolor:'#e2e9f0'},yaxis:{gridcolor:'#e2e9f0'}};
fetch('model_results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Dashboard data is missing. Run valuation_option_lab.ipynb or inspect the GitHub Actions execution.');return r.json()}).then(D=>{const m=D.model,s=D.states,v=D.validation;meta.innerHTML=`<b>${m.company} · ${m.ticker}</b>Valuation date: ${m.valuation_date}<br>${m.exercise_style} ${m.option_type} · ${m.lattice_steps}-step CRR`;const gap=Math.abs((D.analyst_horizon_years??1)-m.maturity_years), aligned=gap<=.25;
app.innerHTML=`<section class="card start"><div><h2>Start here</h2><p><b>Central question:</b> How do valuation beliefs translate into option payoffs, and why can a belief-weighted payoff differ from a no-arbitrage option price?</p><div class="status ${aligned?'ok':'warn'}">${aligned?'✓ Aligned horizons':'! Review horizon alignment'} · Difference ${gap.toFixed(2)} years</div></div><div class="track belief"><div class="tag">BELIEF-BASED ANALYSIS</div><h3>Analyst scenarios</h3><p>Targets → quantile states → subjective weights → discounted expected payoff.</p></div><div class="track pricing"><div class="tag">NO-ARBITRAGE PRICING</div><h3>CRR lattice</h3><p>Spot, strike, volatility, rate, dividends, and maturity → replication value.</p></div></section><nav class="tabs" aria-label="Analysis stages">${['1 Equity beliefs','2 Analyst evidence','3 Scenario payoff','4 Pricing comparison','5 Interpret & submit'].map((x,i)=>`<button class="tab ${i===0?'active':''}" data-stage="${i}" type="button">${x}</button>`).join('')}</nav>
<section class="stage active" id="stage0"><div class="kpis"><div class="card kpi" style="border-color:#0b2747"><div class="label">CURRENT MARKET</div><div class="value">${money(m.spot)}</div><div class="small">Observed equity price</div></div><div class="card kpi" style="border-color:#197ba6"><div class="label">STUDENT DCF</div><div class="value">${money(m.dcf_value)}</div><div class="small">Independent value per share</div></div><div class="card kpi" style="border-color:#0f9188"><div class="label">ANALYST MEDIAN</div><div class="value">${money(D.analyst_stats.median)}</div><div class="small">${D.analyst_stats.count} aligned observations</div></div></div><article class="card panel" style="margin-top:14px"><h2>Equity valuation evidence</h2><p class="small">Compare the current market price with independent estimates. Notice agreement, spread, and the evidence behind each estimate.</p><div id="valuation" class="plot"></div></article></section>
<section class="stage" id="stage1"><div class="grid3"><article class="card panel" style="grid-column:span 2"><h2>Analyst target distribution</h2><p class="small">Cross-sectional opinions, not risk-neutral probabilities.</p><div id="dist" class="plot"></div></article><article class="card panel"><h2>What should I notice?</h2><p class="small">Mean ${money(D.analyst_stats.mean)}, median ${money(D.analyst_stats.median)}, range ${money(D.analyst_stats.min)}–${money(D.analyst_stats.max)}. Examine concentration, tails, dependence, and horizon consistency.</p><button class="btn secondary" id="toggleData" type="button">View underlying values</button><div id="raw" class="small" hidden>${D.analyst_targets.map(money).join(' · ')}</div></article></div></section>
<section class="stage" id="stage2"><div class="grid3"><article class="card panel"><h2>Five-state construction</h2><div class="table-wrap"><table class="state"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th><th>PAYOFF</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${colors[i]}">${z.state}</span></td><td>${money(z.terminal_price)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td><td>${money(z.option_payoff)}</td></tr>`).join('')}</tbody></table></div></article><article class="card panel" style="grid-column:span 2"><h2>Payoff-producing states</h2><p class="small">${(D.belief_decomposition.weight_zero_payoff*100).toFixed(0)}% of assigned scenario weight produces zero payoff. The discounted belief-weighted payoff is ${money(D.valuation_weighted_expected_payoff)}.</p><div id="payoff" class="plot"></div></article></div></section>
<section class="stage" id="stage3"><div class="kpis"><div class="card kpi" style="border-color:#0f9188"><div class="label">BELIEF-WEIGHTED PAYOFF</div><div class="value">${money(D.valuation_weighted_expected_payoff)}</div><div class="small">Subjective discounted expected payoff</div></div><div class="card kpi" style="border-color:#197ba6"><div class="label">CRR VALUE</div><div class="value">${money(D.lattice.price)}</div><div class="small">No-arbitrage lattice value</div></div><div class="card kpi" style="border-color:#c78a12"><div class="label">MARKET MIDPOINT</div><div class="value">${money(m.market_mid)}</div><div class="small">Bid ${money(m.market_bid)} · Ask ${money(m.market_ask)}</div></div></div><div class="grid3" style="margin-top:14px"><article class="card panel" style="grid-column:span 2"><h2>Compare the three values</h2><div id="compare" class="plot"></div></article><article class="card panel"><h2>Model validation</h2><div class="checks">${[['Theoretical bounds',v.inside_theoretical_bounds,'The CRR price is tested against option-value bounds.'],['Put-call parity',v.put_call_parity_pass,`Residual: ${Number(v.parity_residual).toExponential(2)}.`],['Risk-neutral probability',v.valid_risk_neutral_probability,`p* = ${Number(D.lattice.p_star).toFixed(4)} and must lie between zero and one.`],['Lattice convergence',v.convergence_pass,`500-step minus 200-step value: ${money(v.convergence_gap)}.`]].map(x=>`<div class="check"><button type="button">${x[1]?'✓':'✕'} ${x[0]}</button><div class="detail">${x[2]}</div></div>`).join('')}</div></article></div></section>
<section class="stage" id="stage4"><article class="card panel"><div class="toolbar"><div><h2>Decision memo evidence</h2><p class="small">Use the evidence below to build your own conclusion and numerical reversal condition.</p></div><button class="btn" id="copy" type="button">Copy evidence summary</button></div><div class="memo-grid"><div class="prompt"><b>Equity valuation</b><span class="small">Explain current price, DCF, comparables, and analyst median.</span></div><div class="prompt"><b>Analyst distribution</b><span class="small">Discuss central tendency, dispersion, outliers, dependence, and limitations.</span></div><div class="prompt"><b>Option pricing</b><span class="small">Compare belief payoff, CRR value, bid, midpoint, and ask without treating them as identical objects.</span></div><div class="prompt"><b>Model risk and reversal</b><span class="small">Identify the most material assumption and state what numerical evidence would change the conclusion.</span></div></div></article><article class="card panel" style="margin-top:14px"><h2>Submission progress</h2><div class="progress">${['Inputs completed','Sources documented','Notebook executed','Validation passed','Dashboard generated','Memo completed','Repository URL ready','Pages URL ready'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></article></section><div class="footer">Generated from CSV inputs through the executed notebook. Baseline dashboard values are not manually typed.</div>`;
function draw(){let val=Object.entries(D.valuation);Plotly.newPlot('valuation',[{type:'bar',orientation:'h',y:val.map(x=>x[0]),x:val.map(x=>x[1]),marker:{color:['#68798e','#c78a12','#197ba6','#0f9188']},text:val.map(x=>money(x[1])),textposition:'outside',hovertemplate:'%{y}: %{x:$,.2f}<extra></extra>'}],{...base,showlegend:false,xaxis:{gridcolor:'#e2e9f0',tickprefix:'$',title:'Value per share'},yaxis:{autorange:'reversed'}},cfg);Plotly.newPlot('dist',[{type:'box',x:D.analyst_targets,name:'Analyst targets',orientation:'h',boxpoints:'all',jitter:.35,marker:{color:'#0f9188',symbol:'diamond'},line:{color:'#0b2747'},hovertemplate:'Target %{x:$,.2f}<extra></extra>'}],{...base,showlegend:false,xaxis:{gridcolor:'#e2e9f0',tickprefix:'$',title:'12-month target'},yaxis:{visible:false}},cfg);let min=Math.min(...s.map(z=>z.terminal_price),m.strike),max=Math.max(...s.map(z=>z.terminal_price),m.strike),xs=[];for(let x=Math.max(0,min-15);x<=max+15;x+=(max-min+30)/120)xs.push(x);let ys=xs.map(x=>m.option_type==='call'?Math.max(x-m.strike,0):Math.max(m.strike-x,0));Plotly.newPlot('payoff',[{type:'scatter',mode:'lines',x:xs,y:ys,line:{color:'#e26522',width:4},name:'Payoff profile'},{type:'scatter',mode:'markers+text',x:s.map(z=>z.terminal_price),y:s.map(z=>z.option_payoff),text:s.map(z=>z.state),textposition:'top center',marker:{size:13,color:colors,symbol:['circle','square','diamond','triangle-up','star']},name:'States'}],{...base,showlegend:false,xaxis:{gridcolor:'#e2e9f0',tickprefix:'$',title:'Terminal stock price'},yaxis:{gridcolor:'#e2e9f0',tickprefix:'$',title:'Option payoff'}},cfg);let c=Object.entries(D.comparison);Plotly.newPlot('compare',[{type:'bar',x:c.map(x=>x[0]),y:c.map(x=>x[1]),marker:{color:['#0f9188','#197ba6','#c78a12']},text:c.map(x=>money(x[1])),textposition:'outside'}],{...base,showlegend:false,yaxis:{gridcolor:'#e2e9f0',tickprefix:'$',title:'Value'},xaxis:{tickangle:-10}},cfg)}draw();document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.stage').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('stage'+b.dataset.stage).classList.add('active');setTimeout(()=>window.dispatchEvent(new Event('resize')),20)}));document.querySelectorAll('.check button').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));toggleData.addEventListener('click',()=>{raw.hidden=!raw.hidden;toggleData.textContent=raw.hidden?'View underlying values':'Hide underlying values'});copy.addEventListener('click',()=>{let t=`${m.company} (${m.ticker}) evidence summary\nCurrent price ${money(m.spot)}; DCF ${money(m.dcf_value)}; comps ${money(m.comps_value)}; analyst median ${money(D.analyst_stats.median)}.\nBelief-weighted payoff ${money(D.valuation_weighted_expected_payoff)}; CRR value ${money(D.lattice.price)}; observed midpoint ${money(m.market_mid)}.\nZero-payoff scenario weight ${(D.belief_decomposition.weight_zero_payoff*100).toFixed(0)}%. ${D.distribution_comparison.message}`;navigator.clipboard.writeText(t).then(()=>copy.textContent='Copied').catch(()=>copy.textContent='Copy unavailable')});}).catch(e=>app.innerHTML=`<div class="error"><h2>Dashboard could not load</h2><p>${e.message}</p><p>Confirm that the notebook generated <b>docs/model_results.json</b> and that GitHub Actions completed successfully.</p></div>`);
</script></body></html>
