<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valuation-to-Option Pricing Lab</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--navy:#0b2747;--navy2:#173f68;--ink:#10243d;--muted:#5a6e84;--bg:#eef3f8;--card:#fff;--line:#d6e1eb;--teal:#0fa99d;--blue:#197ba6;--gold:#e2a72d;--orange:#f2762e;--red:#d94d4d;--green:#187457;--shadow:0 10px 28px rgba(11,39,71,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:27px max(28px,calc((100vw - 1500px)/2));border-bottom:4px solid var(--teal)}.hero-inner{display:flex;justify-content:space-between;align-items:flex-end}.eyebrow{color:#ffc44f;font-size:12px;font-weight:850;letter-spacing:.16em}.hero h1{font-size:33px;margin:7px 0 4px;letter-spacing:-.035em}.hero p{margin:0;color:#d8e4ef;font-size:14px}.firm{text-align:right;color:#d8e4ef;font-size:12px;line-height:1.55}.firm b{display:block;color:#fff;font-size:15px}main{max-width:1500px;margin:auto;padding:24px 28px 38px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.kpi{padding:18px 19px;min-height:116px;border-top:4px solid transparent}.label{font-size:10px;font-weight:850;letter-spacing:.09em;color:var(--muted)}.value{font-size:30px;font-weight:850;letter-spacing:-.035em;margin:12px 0 5px;line-height:1}.hint{font-size:11px;color:var(--muted)}.row{display:grid;grid-template-columns:1.02fr 1.32fr .78fr;gap:16px;margin-top:16px}.row.bottom{grid-template-columns:1.18fr .92fr .72fr}.panel{padding:20px;min-width:0}.panel h2{font-size:16px;margin:0}.caption{font-size:11px;color:var(--muted);margin:5px 0 0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.n{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e6f6f4;color:#08786f;font-size:11px;margin-right:7px}.plot{height:330px;width:100%}.summary-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 1px}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#f7fafc;font-size:11px;color:var(--muted)}.chip b{color:var(--ink);margin-left:4px}.state-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}.state-table td,.state-table th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.state-table th{font-size:9px;color:var(--muted);letter-spacing:.08em}.state-table td:nth-child(n+2){font-weight:750}.pill{color:#fff;border-radius:12px;padding:5px 9px;font-size:10px;font-weight:850}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.check{background:#edf9f5;border:1px solid #bde2d7;color:var(--green);padding:9px;border-radius:9px;font-size:10px;font-weight:800}.outcomes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:3px}.outcome{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#f8fafc}.outcome .state{font-size:9px;font-weight:850;color:var(--muted);letter-spacing:.07em}.outcome .numbers{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11px}.outcome b{font-size:13px}.memo{background:linear-gradient(145deg,#fff,#f8fbfd)}.badge{display:inline-block;background:#dcf4eb;color:var(--green);border-radius:14px;padding:7px 10px;font-size:10px;font-weight:850}.memo h3{font:700 27px/1.16 Georgia,serif;color:var(--navy);margin:16px 0}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.metric b{font-size:14px}.memo p{font-size:13px;line-height:1.65;color:var(--muted)}.method{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:var(--navy);color:#fff;padding:17px 20px;border-radius:15px;margin-top:16px}.step{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:850}.step span{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--teal)}.footer{display:flex;justify-content:space-between;padding:15px 3px 0;color:var(--muted);font-size:10px}.error{max-width:850px;margin:45px auto;background:#fff;border-left:5px solid var(--red);padding:25px;border-radius:12px}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(3,1fr)}.row,.row.bottom{grid-template-columns:1fr}.plot{height:390px}.firm{display:none}}@media(max-width:640px){.hero{padding:23px 18px}.hero h1{font-size:25px}main{padding:14px}.kpis{grid-template-columns:1fr 1fr}.value{font-size:24px}.outcomes{grid-template-columns:1fr 1fr}.method{grid-template-columns:1fr}.footer{display:block}}
</style></head><body>
<header class="hero"><div class="hero-inner"><div><div class="eyebrow">STUDENT PORTFOLIO ARTIFACT</div><h1>Valuation-to-Option Pricing Lab</h1><p>Equity valuation beliefs, state-contingent payoffs, and risk-neutral pricing</p></div><div class="firm" id="firmMeta"></div></div></header>
<main id="app"><div class="card panel">Loading validated notebook results…</div></main>
<script>
const C={navy:'#0b2747',blue:'#197ba6',teal:'#0fa99d',gold:'#e2a72d',orange:'#f2762e',red:'#d94d4d',slate:'#68798e'};
const config={responsive:true,displayModeBar:false,scrollZoom:false};
const money=v=>'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const base={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, Segoe UI, Arial',size:13,color:'#10243d'},hoverlabel:{bgcolor:C.navy,bordercolor:C.navy,font:{size:14,color:'#fff'}},xaxis:{gridcolor:'#e2e9f0',zerolinecolor:'#cbd6e0',tickfont:{size:12,color:'#50647c'},automargin:true},yaxis:{gridcolor:'#dce5ed',zerolinecolor:'#cbd6e0',tickfont:{size:12,color:'#50647c'},automargin:true}};
fetch('model_results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('model_results.json was not generated');return r.json()}).then(D=>{
const m=D.model,s=D.states,v=D.validation;firmMeta.innerHTML=`<b>${m.company} · ${m.ticker}</b>Valuation date: ${m.valuation_date}<br>${m.exercise_style} ${m.option_type} · ${m.lattice_steps}-step CRR lattice`;
const kpis=[['CURRENT PRICE',m.spot,'Observed spot',C.navy],['STUDENT DCF',m.dcf_value,'Equity value per share',C.blue],['ANALYST CONSENSUS',D.analyst_stats.mean,`${D.analyst_stats.count} aligned targets`,C.teal],['SELECTED STRIKE',m.strike,`${m.exercise_style} ${m.option_type}`,C.gold],['CRR LATTICE',D.lattice.price,`${m.lattice_steps}-step model`,C.blue],['MARKET MIDPOINT',m.market_mid,`Bid ${money(m.market_bid)} · Ask ${money(m.market_ask)}`,C.orange]];
app.innerHTML=`<section class="kpis">${kpis.map(k=>`<div class="card kpi" style="border-top-color:${k[3]}"><div class="label">${k[0]}</div><div class="value" style="color:${k[3]}">${money(k[1])}</div><div class="hint">${k[2]}</div></div>`).join('')}</section>
<section class="row"><article class="card panel"><div class="head"><div><h2><span class="n">1</span>Equity valuation</h2><p class="caption">Current price and independent valuation estimates</p></div></div><div id="valuation" class="plot"></div></article>
<article class="card panel"><div class="head"><div><h2><span class="n">2</span>Analyst target distribution</h2><p class="caption">Cross-sectional analyst opinions, not risk-neutral probabilities</p></div></div><div class="summary-chips"><span class="chip">Mean <b>${money(D.analyst_stats.mean)}</b></span><span class="chip">Median <b>${money(D.analyst_stats.median)}</b></span><span class="chip">Range <b>${money(D.analyst_stats.min)}–${money(D.analyst_stats.max)}</b></span></div><div id="distribution" class="plot"></div></article>
<article class="card panel"><div class="head"><div><h2><span class="n">3</span>State construction</h2><p class="caption">Quantile-derived prices with disclosed subjective weights</p></div></div><table class="state-table"><thead><tr><th>STATE</th><th>PRICE</th><th>WEIGHT</th><th>PAYOFF</th></tr></thead><tbody>${s.map((z,i)=>`<tr><td><span class="pill" style="background:${[C.red,C.gold,C.teal,C.blue][i]}">${z.state}</span></td><td>${money(z.terminal_price)}</td><td>${(z.subjective_weight*100).toFixed(0)}%</td><td>${money(z.option_payoff)}</td></tr>`).join('')}</tbody></table><div class="checks"><div class="check">✓ Weights total 100%</div><div class="check">✓ Inputs nonnegative</div></div></article></section>
<section class="row bottom"><article class="card panel"><div class="head"><div><h2><span class="n">4</span>Derivative payoff layer</h2><p class="caption">Continuous payoff profile and state outcomes</p></div></div><div id="payoff" class="plot"></div><div class="outcomes">${s.map((z,i)=>`<div class="outcome"><div class="state" style="color:${[C.red,C.gold,C.teal,C.blue][i]}">${z.state.toUpperCase()}</div><div class="numbers"><span>Stock ${money(z.terminal_price)}</span><b>${money(z.option_payoff)}</b></div></div>`).join('')}</div></article>
<article class="card panel"><div class="head"><div><h2><span class="n">5</span>Option value comparison</h2><p class="caption">Subjective expected payoff, no-arbitrage value, and market</p></div></div><div id="pricing" class="plot"></div><div class="checks"><div class="check">${v.inside_theoretical_bounds?'✓':'✕'} Theoretical bounds</div><div class="check">${v.put_call_parity_pass?'✓':'✕'} Put-call parity</div><div class="check">${v.valid_risk_neutral_probability?'✓':'✕'} Valid p*</div><div class="check">${v.convergence_pass?'✓':'✕'} Convergence</div></div></article>
<article class="card panel memo"><span class="badge">● VALIDATED MODEL</span><h3>${Math.abs(m.market_mid-D.lattice.price)<.25?'Market and lattice values are closely aligned.':'The model identifies a meaningful pricing gap.'}</h3><div class="metric"><span>CRR value</span><b>${money(D.lattice.price)}</b></div><div class="metric"><span>Market midpoint</span><b>${money(m.market_mid)}</b></div><div class="metric"><span>Belief-weighted value</span><b>${money(D.valuation_weighted_expected_payoff)}</b></div><div class="metric"><span>Market–model gap</span><b>${money(m.market_mid-D.lattice.price)}</b></div><p>The belief-weighted estimate remains separate because subjective scenario weights are not risk-neutral probabilities.</p></article></section>
<section class="method">${['VALUE THE EQUITY','MODEL ANALYST OPINIONS','CONSTRUCT STATES','PRICE THE CLAIM','INTERPRET THE GAP'].map((x,i)=>`<div class="step"><span>${i+1}</span>${x}</div>`).join('')}</section><div class="footer"><span>Generated from student CSV inputs through the executed Python notebook.</span><span>Dashboard values are never manually typed.</span></div>`;

// Horizontal valuation bars eliminate category-label collision.
const ve=Object.entries(D.valuation),vn=ve.map(x=>x[0]),vv=ve.map(x=>Number(x[1]));
Plotly.newPlot('valuation',[{type:'bar',orientation:'h',y:vn,x:vv,marker:{color:[C.slate,C.gold,C.blue,C.teal]},text:vv.map(money),textposition:'outside',cliponaxis:false,textfont:{size:15,color:C.navy},hovertemplate:'<b>%{y}</b><br>%{text}<extra></extra>'}],{...base,showlegend:false,margin:{l:146,r:70,t:35,b:48},xaxis:{...base.xaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...vv)*1.28],title:{text:'Equity value per share',font:{size:12}}},yaxis:{...base.yaxis,autorange:'reversed',tickfont:{size:12,color:C.navy},gridcolor:'rgba(0,0,0,0)'}},config);

// Mean/median labels live in chips above, not inside the plot.
const targets=D.analyst_targets.map(Number).filter(Number.isFinite).sort((a,b)=>a-b),tmin=Math.min(...targets),tmax=Math.max(...targets),pad=Math.max((tmax-tmin)*.14,3);
Plotly.newPlot('distribution',[{type:'box',x:targets,name:'',orientation:'h',boxpoints:'all',jitter:.4,pointpos:0,marker:{size:11,color:C.teal,line:{color:'#fff',width:1.5}},line:{color:C.navy,width:2},fillcolor:'rgba(15,169,157,.12)',hovertemplate:'Analyst target <b>%{x:$,.2f}</b><extra></extra>'}],{...base,showlegend:false,margin:{l:32,r:28,t:28,b:60},xaxis:{...base.xaxis,tickprefix:'$',tickformat:',.0f',range:[tmin-pad,tmax+pad],nticks:7,title:{text:'12-month price target',font:{size:12}}},yaxis:{visible:false},shapes:[{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.mean),x1:Number(D.analyst_stats.mean),y0:.08,y1:.92,line:{color:C.navy,width:3}},{type:'line',xref:'x',yref:'paper',x0:Number(D.analyst_stats.median),x1:Number(D.analyst_stats.median),y0:.08,y1:.92,line:{color:C.gold,width:3,dash:'dash'}}]},config);

// State names move below the chart into outcome cards, leaving only clean markers.
const sp=s.map(z=>Number(z.terminal_price)),xmin=Math.min(...sp,Number(m.strike)),xmax=Math.max(...sp,Number(m.strike)),range=Math.max(xmax-xmin,10),xs=Math.max(0,xmin-range*.32),xe=xmax+range*.28,x=[];for(let q=xs;q<=xe;q+=(xe-xs)/150)x.push(q);const cy=x.map(q=>m.option_type==='call'?Math.max(q-m.strike,0):Math.max(m.strike-q,0));
Plotly.newPlot('payoff',[{type:'scatter',mode:'lines',x,y:cy,line:{color:C.orange,width:4},fill:'tozeroy',fillcolor:'rgba(242,118,46,.08)',hovertemplate:'Terminal stock <b>%{x:$,.2f}</b><br>Payoff <b>%{y:$,.2f}</b><extra></extra>'},{type:'scatter',mode:'markers',x:sp,y:s.map(z=>Number(z.option_payoff)),marker:{size:14,color:[C.red,C.gold,C.teal,C.blue],line:{color:'#fff',width:2}},customdata:s.map(z=>z.state),hovertemplate:'<b>%{customdata}</b><br>Stock %{x:$,.2f}<br>Payoff %{y:$,.2f}<extra></extra>'}],{...base,showlegend:false,margin:{l:74,r:26,t:38,b:66},xaxis:{...base.xaxis,tickprefix:'$',tickformat:',.0f',dtick:Math.max(5,Math.round(range/6/5)*5),range:[xs,xe],title:{text:'Terminal stock price',font:{size:12}}},yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',rangemode:'tozero',title:{text:'Option payoff',font:{size:12}}},shapes:[{type:'line',x0:Number(m.strike),x1:Number(m.strike),y0:0,y1:Math.max(...cy),line:{color:C.navy,width:2,dash:'dot'}}],annotations:[{xref:'x',yref:'paper',x:Number(m.strike),y:.98,text:`Strike ${money(m.strike)}`,showarrow:false,xanchor:'left',font:{size:12,color:C.navy},bgcolor:'rgba(255,255,255,.9)'}]},config);

const cv=Object.values(D.comparison).map(Number),cn=['Belief-weighted','CRR lattice','Market midpoint'];
Plotly.newPlot('pricing',[{type:'bar',x:cn,y:cv,marker:{color:[C.teal,C.blue,C.orange]},text:cv.map(money),textposition:'outside',cliponaxis:false,textfont:{size:17,color:C.navy},hovertemplate:'<b>%{x}</b><br>%{text}<extra></extra>'}],{...base,showlegend:false,bargap:.34,margin:{l:62,r:25,t:45,b:75},xaxis:{...base.xaxis,tickfont:{size:12}},yaxis:{...base.yaxis,tickprefix:'$',tickformat:',.0f',range:[0,Math.max(...cv)*1.27]}},config);
}).catch(e=>app.innerHTML=`<div class="error"><b>Dashboard results are unavailable.</b><p>${e.message}</p><p>Run the notebook to regenerate <code>docs/model_results.json</code>.</p></div>`);
</script></body></html>
